spring:
  application:
    name: Kenny-EVAFINAL

  # ------------------------------------------------------------------
  # Datos: MySQL (sobrescribibles por variables de entorno)
  # ------------------------------------------------------------------
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:biblioteca}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci
    username: ${DB_USERNAME:IN5AM}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: BibliotecaHikari
      # Dimensionado para soportar mas de 100 peticiones concurrentes: cuando no
      # hay conexion libre la peticion espera (connection-timeout) en lugar de
      # fallar de inmediato. Si se supera la carga sostenida, conviene subir el
      # pool junto con max_connections de MySQL.
      maximum-pool-size: ${DB_POOL_MAX:30}
      minimum-idle: 5
      connection-timeout: 10000
      idle-timeout: 600000
      max-lifetime: 1800000
      validation-timeout: 2500
      leak-detection-threshold: 60000

  # ------------------------------------------------------------------
  # JPA / Hibernate
  # ------------------------------------------------------------------
  jpa:
    # open-in-view=false: el esquema de sesion se cierra al terminar el servicio.
    # Toda la carga diferida necesaria se resuelve con JOIN FETCH en los repositorios,
    # lo que ademas obliga a no depender de la sesion abierta durante la serializacion.
    open-in-view: false
    hibernate:
      # El esquema lo define db/schema.sql (fuente unica de verdad); Hibernate no
      # genera ni modifica tablas en tiempo de ejecucion.
      ddl-auto: none
    properties:
      hibernate:
        default_batch_fetch_size: 50
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true

  # Esquema e informacion inicial. Idempotente: se puede reiniciar el servicio
  # tantas veces como se quiera sobre la misma base de datos.
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data.sql
      encoding: UTF-8
      continue-on-error: false

  threads:
    # Hilos virtuales (Java 21+): permiten atender cientos de peticiones
    # concurrentes sin bloquear un hilo de plataforma por cada espera de E/S.
    # Si el runtime fuera Java 17, esta propiedad se ignora y entra en juego la
    # configuracion de threads.max de Tomcat mas abajo.
    virtual:
      enabled: true

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  tomcat:
    # Valores usados cuando los hilos virtuales estan desactivados.
    threads:
      max: ${TOMCAT_THREADS_MAX:50}
      min-spare: 10
    # Cola de conexiones aceptadas pendientes de ser leidas por un hilo de
    # aplicacion: absorbe picos de trafico sin rechazar clientes.
    accept-count: 100
    max-connections: 10000
    connection-timeout: 20s
    mbeanregistry.enabled: true

jwt:
  # SOLO para desarrollo. En produccion se inyecta desde la variable de entorno
  # JWT_SECRET con un secreto de al menos 32 bytes (256 bits) para HMAC-SHA256.
  secret: ${JWT_SECRET:Kenny-EVAFINAL-clave-desarrollo-local-32-bytes-minimo}
  expiration: ${JWT_EXPIRATION_MS:86400000}
  issuer: biblioteca-universitaria

logging:
  level:
    root: INFO
    com.Evalucion.Kenny_EVAFINAL: INFO
